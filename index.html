<!-- ============================================================
     City4All — Στατιστικά σε πραγματικό χρόνο
     ΙΔΙΟ ΣΤΥΛ με την ενότητα .city4all-agent:
       · eyebrow με γραμμή 28px (#15803d)
       · τυπογραφία Segoe UI / Roboto
       · accent πράσινο #86c99e
       · διαχωριστικό rgba(203,220,232,.18)
       · note με τονισμένη φράση
     ΔΕΝ χρειάζεται καμία αλλαγή στον worker (χρήση υπαρχόντων endpoints).
     Κεφαλαία ΧΩΡΙΣ τόνους (ελληνική τυπογραφία).
     ============================================================ -->

<style>
  .city4all-stats {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    max-width: 850px;
    margin: 40px 0;
    padding: 8px 0;
    color: #dbe5ef;
    box-sizing: border-box;
  }
  .city4all-stats * { box-sizing: border-box; }

  .city4all-stats .stats-eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    color: #86b99a;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .city4all-stats .stats-eyebrow::before {
    content: "";
    display: block;
    width: 28px;
    height: 1px;
    background: #15803d;
    flex: 0 0 auto;
  }

  .city4all-stats .stats-title {
    margin: 0 0 22px;
    color: #ffffff;
    font-size: clamp(1.55rem, 3vw, 2rem);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.8px;
  }

  /* ---------- οι τέσσερις μετρήσεις ---------- */
  .city4all-stats .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(16px, 3vw, 32px);
  }
  .city4all-stats .stat { min-width: 0; }

  .city4all-stats .stat-num {
    display: block;
    color: #ffffff;
    font-size: clamp(1.75rem, 3.6vw, 2.35rem);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -1.2px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  .city4all-stats .stat-lbl {
    display: block;
    margin-top: 9px;
    color: #86b99a;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 1.6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .city4all-stats .stat-sub {
    display: block;
    margin-top: 4px;
    color: #c6d5e1;
    font-size: 0.82rem;
    line-height: 1.45;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- μπάρες ---------- */
  .city4all-stats .stats-bars {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(14px, 2.6vw, 26px);
    margin-top: 22px;
  }
  .city4all-stats .bar { min-width: 0; }
  .city4all-stats .bar-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
    color: #c6d5e1;
    font-size: 0.78rem;
  }
  .city4all-stats .bar-head span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .city4all-stats .bar-head b {
    color: #ffffff;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .city4all-stats .bar-track {
    height: 3px;
    border-radius: 2px;
    overflow: hidden;
    background: rgba(203, 220, 232, 0.16);
  }
  .city4all-stats .bar-fill {
    height: 100%;
    width: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, #15803d, #86c99e);
    transition: width 1.15s cubic-bezier(.22, .8, .25, 1);
  }

  /* ---------- διαχωριστικό & note ---------- */
  .city4all-stats .stats-divider {
    width: 100%;
    height: 1px;
    margin: 24px 0 18px;
    background: rgba(203, 220, 232, 0.18);
  }

  .city4all-stats .stats-note {
    margin: 0;
    color: #ffffff;
    font-size: 0.94rem;
    line-height: 1.8;
  }
  .city4all-stats .stats-note span { color: #86c99e; }

  .city4all-stats .stats-live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    color: #86b99a;
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 1.6px;
  }
  .city4all-stats .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #86c99e;
    box-shadow: 0 0 0 3px rgba(134, 201, 158, 0.14);
    animation: c4aPulse 2.8s ease-in-out infinite;
    flex: 0 0 auto;
  }
  .city4all-stats .live-dot.is-off {
    background: #7b8b9c;
    box-shadow: 0 0 0 3px rgba(123, 139, 156, 0.14);
    animation: none;
  }
  @keyframes c4aPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(134, 201, 158, 0.14); }
    50%      { box-shadow: 0 0 0 6px rgba(134, 201, 158, 0.05); }
  }

  @media (max-width: 600px) {
    .city4all-stats { margin: 28px 0; }
    .city4all-stats .stats-title { letter-spacing: -0.5px; margin-bottom: 18px; }
    .city4all-stats .stats-grid { grid-template-columns: 1fr 1fr; gap: 20px 18px; }
    .city4all-stats .stats-bars { grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
    .city4all-stats .bar:nth-child(n+2) { display: none; }
    .city4all-stats .stat-lbl { letter-spacing: 1.2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .city4all-stats .live-dot { animation: none; }
    .city4all-stats .bar-fill { transition: none; }
  }
</style>

<section class="city4all-stats" id="c4aStats" role="group" aria-label="Στατιστικά δεδομένων City4All">
  <div class="stats-eyebrow">
    Δεδομενα σε πραγματικο χρονο
    
  </div>

  <h2 class="stats-title">Τι έχει καταγραφεί</h2>

  <div class="stats-grid">
    <div class="stat">
      <span class="stat-num" data-c4a-num="total">0</span>
      <span class="stat-lbl">ΣΗΜΕΙΑ</span>
      <span class="stat-sub">καταγεγραμμένα</span>
    </div>
    <div class="stat">
      <span class="stat-num" data-c4a-num="areas">0</span>
      <span class="stat-lbl">ΠΕΡΙΟΧΕΣ</span>
      <span class="stat-sub" id="c4aAreasSub">δήμοι · περιφέρειες</span>
    </div>
    <div class="stat">
      <span class="stat-num" data-c4a-num="accessRecords">0</span>
      <span class="stat-lbl">ΚΑΤΑΓΡΑΦΕΣ</span>
      <span class="stat-sub">μέσων πρόσβασης</span>
    </div>
    <div class="stat">
      <span class="stat-num" data-c4a-num="wc">0</span>
      <span class="stat-lbl">ΤΟΥΑΛΕΤΕΣ ΑΜΕΑ</span>
      <span class="stat-sub">η μεγαλύτερη έλλειψη</span>
    </div>
  </div>

  <div class="stats-bars" id="c4aBars"></div>

  <div class="stats-divider"></div>

  <p class="stats-note">
    Ενημερώνεται αυτόματα από την καταγραφή.
    <span>Χωρίς εκτιμήσεις — μόνο ό,τι έχει δηλωθεί.</span>
  </p>
</section>

<script>
(function () {
  "use strict";
  var API = "https://city4allfinalai.ilias-pap-net.workers.dev";
  var KEY = "c4a_stats_v4";
  var TTL = 24 * 60 * 60 * 1000;

  var root = document.getElementById("c4aStats");
  if (!root) return;

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    dot: document.getElementById("c4aDot"),
    status: document.getElementById("c4aStatus"),
    areasSub: document.getElementById("c4aAreasSub"),
    bars: document.getElementById("c4aBars")
  };

  /* Κεφαλαία ΧΩΡΙΣ τόνους */
  var TXT = { live: "ΕΝΕΡΓΑ", partial: "ΜΕΡΙΚΑ", stale: "ΤΕΛΕΥΤΑΙΑ ΛΗΨΗ" };

  var FEATURES = [
    { id: "ramp", label: "Ράμπα" },
    { id: "stepfree", label: "Είσοδος χωρίς σκαλοπάτια" },
    { id: "parking", label: "Χώρος στάθμευσης ΑμεΑ" },
    { id: "wc", label: "Τουαλέτα ΑΜΕΑ" },
    { id: "elevator", label: "Ανελκυστήρας/Αναβατόριο" },
    { id: "signage", label: "Ειδική σήμανση για ΑμεΑ" },
    { id: "autodoor", label: "Αυτόματη πόρτα" },
    { id: "handrail", label: "Μπάρες/κουπαστές" },
    { id: "tactile", label: "Οδηγός όδευσης τυφλών" },
    { id: "doorbutton", label: "Κουμπί εισόδου" }
  ];

  var DEFAULT_DATA = {
    total: 951, areas: 206, dimoi: 109, periferies: 13,
    counts: { ramp: 707, stepfree: 328, parking: 285, wc: 171, elevator: 146, signage: 108, autodoor: 69, handrail: 48, tactile: 16, doorbutton: 7 },
    at: 0
  };

  function fmt(n) { return Number(n || 0).toLocaleString("el-GR"); }

  function roll(node, to, from) {
    var target = Number(to) || 0;
    var start = typeof from === "number" ? from : (parseInt(String(node.textContent).replace(/[^\d]/g, ""), 10) || 0);
    node.setAttribute("aria-label", fmt(target));
    if (reduce || start === target) { node.textContent = fmt(target); return; }
    var t0 = performance.now(), dur = 1250;
    (function tick(now) {
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(Math.round(start + (target - start) * e));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  }

  var barEls = null;
  function buildBars() {
    if (!el.bars || barEls) return;
    el.bars.innerHTML = "";
    barEls = FEATURES.slice(0, 3).map(function (f) {
      var row = document.createElement("div"); row.className = "bar";
      var head = document.createElement("div"); head.className = "bar-head";
      var nm = document.createElement("span"); nm.textContent = f.label;
      var vl = document.createElement("b"); vl.textContent = "—";
      head.appendChild(nm); head.appendChild(vl);
      var track = document.createElement("div"); track.className = "bar-track";
      var fill = document.createElement("div"); fill.className = "bar-fill";
      track.appendChild(fill);
      row.appendChild(head); row.appendChild(track);
      el.bars.appendChild(row);
      return { val: vl, fill: fill };
    });
  }

  var firstPaint = true;
  function paint(d) {
    var sum = 0;
    for (var k in d.counts) sum += d.counts[k] || 0;

    var nums = { total: d.total, areas: d.areas, accessRecords: sum, wc: d.counts.wc };
    var fromZero = firstPaint ? 0 : undefined;

    Object.keys(nums).forEach(function (key) {
      var node = root.querySelector('[data-c4a-num="' + key + '"]');
      if (node && typeof nums[key] === "number" && nums[key] > 0) roll(node, nums[key], fromZero);
    });
    firstPaint = false;

    if (el.areasSub) el.areasSub.textContent = fmt(d.dimoi) + " δήμοι · " + fmt(d.periferies) + " περιφέρειες";

    buildBars();
    if (barEls) {
      var max = Math.max(d.counts[FEATURES[0].id] || 1, 1);
      barEls.forEach(function (b, i) {
        var f = FEATURES[i];
        var n = d.counts[f.id] || 0;
        b.val.textContent = Math.round((n / Math.max(d.total, 1)) * 100) + "%";
        var w = Math.max(2, Math.min(100, Math.round((n / max) * 100))) + "%";
        if (reduce) b.fill.style.width = w;
        else setTimeout(function () { b.fill.style.width = w; }, 420 + i * 130);
      });
    }
  }

  function readCache() {
    try {
      var c = JSON.parse(localStorage.getItem(KEY) || "null");
      if (c && c.counts && c.total) return c;
    } catch (e) { /* */ }
    return null;
  }

  function runLimited(tasks, limit) {
    var results = [], i = 0, active = 0, done = 0;
    return new Promise(function (resolve) {
      if (!tasks.length) return resolve(results);
      function next() {
        while (active < limit && i < tasks.length) {
          (function (idx) {
            active++;
            tasks[idx]().then(function (v) { results[idx] = v; })
              .catch(function () { results[idx] = null; })
              .then(function () {
                active--; done++;
                if (done === tasks.length) resolve(results); else next();
              });
          })(i++);
        }
      }
      next();
    });
  }

  function withTimeout(fn, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return fn(ctrl.signal).finally(function () { clearTimeout(timer); });
  }

  function postTotal(body) {
    return withTimeout(function (signal) {
      return fetch(API + "/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ pageSize: 1 }, body || {})),
        signal: signal
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.success && typeof d.total === "number") return d.total;
          throw new Error("bad");
        });
    }, 12000);
  }

  function getValues(level) {
    return withTimeout(function (signal) {
      return fetch(API + "/locations?level=" + level, { signal: signal })
        .then(function (r) { return r.json(); })
        .then(function (d) { return (d && d.values) || []; });
    }, 12000);
  }

  function strip(s) {
    return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  }
  function uniqCount(list) {
    var seen = Object.create(null), n = 0;
    for (var i = 0; i < list.length; i++) {
      var k = strip(list[i]);
      if (!k) continue;
      if (!seen[k]) { seen[k] = 1; n++; }
    }
    return n;
  }

  function refresh() {
    var tasks = [
      function () { return postTotal({}); },
      function () { return getValues("area"); },
      function () { return getValues("dimos"); },
      function () { return getValues("perifereia"); }
    ];
    FEATURES.forEach(function (f) {
      tasks.push(function () { return postTotal({ accessibility: [f.id] }); });
    });

    return runLimited(tasks, 4).then(function (res) {
      var total = res[0];
      if (typeof total !== "number") throw new Error("total missing");

      var data = {
        total: total,
        areas: Array.isArray(res[1]) ? uniqCount(res[1]) : DEFAULT_DATA.areas,
        dimoi: Array.isArray(res[2]) ? uniqCount(res[2]) : DEFAULT_DATA.dimoi,
        periferies: Array.isArray(res[3]) ? res[3].length : DEFAULT_DATA.periferies,
        counts: Object.assign({}, DEFAULT_DATA.counts),
        at: Date.now(),
        partial: false
      };

      var ok = 0;
      FEATURES.forEach(function (f, i) {
        var v = res[4 + i];
        if (typeof v === "number") { data.counts[f.id] = v; ok++; }
      });
      data.partial = ok < FEATURES.length;

      paint(data);
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* */ }

      if (el.dot) el.dot.className = data.partial ? "live-dot is-off" : "live-dot";
      if (el.status) el.status.textContent = data.partial ? TXT.partial : TXT.live;
      return data;
    });
  }

  var cached = readCache();
  paint(cached && (Date.now() - cached.at) < TTL ? cached : Object.assign({}, DEFAULT_DATA, { at: 0 }));

  refresh().catch(function () {
    if (el.dot) el.dot.className = "live-dot is-off";
    if (el.status) el.status.textContent = TXT.stale;
  });
})();
</script>
